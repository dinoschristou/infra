services:
  stirlingpdf:
    image: frooodle/s-pdf:2.14.3@sha256:3b3670fce70b396ec56ba380a3cc7858e0abf83fe13f31c88f7737847763a396
    networks:
      - proxy
    container_name: stirlingpdf
    volumes:
      - "./configs:/configs"
      - "./ocr-data:/usr/share/tesseract-ocr/5/tessdata"
    labels:
      - traefik.enable=true
      - "traefik.http.routers.pdf.rule=Host(`pdf.${FULL_DOMAIN}`)"
      - "traefik.http.routers.pdf.entrypoints=https"
      - "traefik.http.routers.pdf.tls=true"
    environment:
      - DOCKER_ENABLE_SECURITY=false
      - TZ=${TZ}
      - PUID=1000
      - PGID=1000
    restart: unless-stopped
    env_file:
      - .env

networks:
  proxy:
    external: true