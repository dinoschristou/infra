services:
  mealie:
    image: hkotel/mealie:v3.22.0@sha256:36c28f0642fb6c75fae8997a2d55994631b9b4bcffba3016c208fc132a4c1e69
    container_name: mealie
    networks:
      - proxy
    volumes:
      - "./data:/app/data"
    env_file:
      - .env
    labels:
      - traefik.enable=true
      - "traefik.http.routers.mealie.rule=Host(`mealie.${FULL_DOMAIN}`)"
      - "traefik.http.routers.mealie.entrypoints=https"
      - "traefik.http.routers.mealie.tls=true"
    environment:
      - TZ=${TZ}
      - PUID=1000
      - PGID=1000
      - DB_ENGINE=sqlite
      - "BASE_URL=https://mealie.${FULL_DOMAIN}"
    restart: unless-stopped

networks:
  proxy:
    external: true