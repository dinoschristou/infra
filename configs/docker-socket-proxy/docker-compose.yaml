services:
  docker-socket-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:0.3.0
    container_name: docker-socket-proxy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      SERVICES: 0
      TASKS: 0
      POST: 0
      EVENTS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxy
    read_only: true
    tmpfs:
      # haproxy entrypoint regenerates its config here at startup
      - /run
      - /usr/local/etc/haproxy

networks:
  proxy:
    external: true
