services:
  prometheus:
    image: prom/prometheus:v3.13.2@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69
    container_name: prometheus
    volumes:
      - ./prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/config.yaml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--storage.tsdb.retention.size=80GB"
      - "--web.enable-lifecycle"
      - "--storage.tsdb.wal-compression"
    restart: unless-stopped
    expose:
      - 9090
    env_file:
      - .env
    networks:
      - proxy
    labels:
      - "org.label-schema.group=monitoring"
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.${FULL_DOMAIN}`)"
      - "traefik.http.routers.prometheus.entrypoints=https"
      - "traefik.http.routers.prometheus.tls=true"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"

  alertmanager:
    image: prom/alertmanager:v0.33.1@sha256:9e082985f56f4c8c9f724e18f2288c6708f472e56a5286b8863d080434ea065d
    container_name: alertmanager
    volumes:
      - ./alertmanager:/etc/alertmanager
    command:
      - "--config.file=/etc/alertmanager/config.yaml"
      - "--storage.path=/alertmanager"
    restart: unless-stopped
    expose:
      - 9093
    networks:
      - proxy
    env_file:
      - .env
    labels:
      - "org.label-schema.group=monitoring"
      - "traefik.enable=true"
      - "traefik.http.routers.alertmanager.rule=Host(`alertmanager.${FULL_DOMAIN}`)"
      - "traefik.http.routers.alertmanager.entrypoints=https"
      - "traefik.http.routers.alertmanager.tls=true"
      - "traefik.http.services.alertmanager.loadbalancer.server.port=9093"

  loki:
    image: grafana/loki:3.7.6@sha256:efd47c67f9bac88ca29bcf8cb997d9ab29d1848bd0aff579282295542a745952
    container_name: loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - proxy
    env_file:
      - .env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.loki.rule=Host(`loki.${FULL_DOMAIN}`)"
      - "traefik.http.routers.loki.entrypoints=https"
      - "traefik.http.routers.loki.tls=true"
      - "traefik.http.services.loki.loadbalancer.server.port=3100"

  grafana:
    image: grafana/grafana:13.1.3@sha256:ab5cb380e3ff3172d6c8bd2e7cfd31cce977d2881b260e1f5bc089bf0b759b43
    container_name: grafana
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    restart: unless-stopped
    expose:
      - 3000
    networks:
      - proxy
    env_file:
      - .env
    labels:
      - "org.label-schema.group=monitoring"
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.${FULL_DOMAIN}`)"
      - "traefik.http.routers.grafana.entrypoints=https"
      - "traefik.http.routers.grafana.tls=true"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

  pushgateway:
    image: prom/pushgateway:v1.11.3
    container_name: pushgateway
    restart: unless-stopped
    expose:
      - 9091
    networks:
      - proxy
    env_file:
      - .env
    labels:
      - "org.label-schema.group=monitoring"
      - "traefik.enable=true"
      - "traefik.http.routers.pushgateway.rule=Host(`pushgateway.${FULL_DOMAIN}`)"
      - "traefik.http.routers.pushgateway.entrypoints=https"
      - "traefik.http.routers.pushgateway.tls=true"
      - "traefik.http.services.pushgateway.loadbalancer.server.port=9091"

  pihole-exporter1:
    image: ekofr/pihole-exporter:v1.2.0
    container_name: pihole-exporter1
    environment:
      - PIHOLE_PROTOCOL=http
      - PIHOLE_HOSTNAME=${PIHOLE_HOSTNAME}
      - "PIHOLE_PASSWORD=${PIHOLE_PASSWORD}"
      - PORT=9617
    restart: unless-stopped
    networks:
      - proxy
    expose:
      - 9617
    env_file:
      - .env
    
  pihole-exporter2:
    image: ekofr/pihole-exporter:v1.2.0
    container_name: pihole-exporter2
    environment:
      - PIHOLE_PROTOCOL=http
      - PIHOLE_HOSTNAME=${PIHOLE_BACKUP_HOSTNAME}
      - "PIHOLE_PASSWORD=${PIHOLE_BACKUP_PASSWORD}"
      - PORT=9618
    restart: unless-stopped
    networks:
      - proxy
    expose:
      - 9618
    env_file:
      - .env

  proxmox-exporter:
    image: prompve/prometheus-pve-exporter:3.9.0
    container_name: proxmox-exporter
    volumes:
      - ./pve:/etc/pve_exporter
    command:
      - "--config.file=/etc/pve_exporter/pve.yml"
    restart: unless-stopped
    expose:
      - 9221
    networks:
      - proxy
    env_file:
      - .env

  prometheus-plex-exporter:
    container_name: prometheus-plex-exporter
    image: ghcr.io/timothystewart6/prometheus-plex-exporter:latest
    pull_policy: always
    restart: unless-stopped
    networks:
      - proxy
    env_file:
      - .env
    expose:
     - 9000
    security_opt:
      - no-new-privileges:true

  unpoller:
    image: ghcr.io/unpoller/unpoller:v3.4.1@sha256:87e5bdca854b2fc2a1c6d73525c81bf541078e70db0059473a3c024fa3e69c97
    restart: unless-stopped
    networks:
      - proxy
    container_name: unpoller
    env_file:
      - .env
    ports:
      - '9130:9130'

networks:
  proxy:
    external: true

volumes:
  prometheus_data:
    driver: local
    name: prometheus_data
  grafana_data:
    driver: local
    name: grafana_data
  loki_data:
    driver: local
    name: loki_data
