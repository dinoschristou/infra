services:
  freshrss:
    image: lscr.io/linuxserver/freshrss:1.29.1
    networks:
      - proxy
    container_name: freshrss
    volumes:
      - freshrss_data:/config
    labels:
      - traefik.enable=true
      # Backend service (linuxserver/freshrss listens on :80)
      - "traefik.http.services.freshrss.loadbalancer.server.port=80"
      # --- UI: interactive Authentik SSO ---
      - "traefik.http.routers.freshrss.rule=Host(`freshrss.${FULL_DOMAIN}`)"
      - "traefik.http.routers.freshrss.entrypoints=https"
      - "traefik.http.routers.freshrss.tls=true"
      - "traefik.http.routers.freshrss.service=freshrss"
      - "traefik.http.routers.freshrss.middlewares=authentik@file"
      # --- API (greader/fever): excluded from SSO (non-interactive clients).
      #     Protected by FreshRSS's own per-user API password + rate limiting.
      #     Higher priority so /api/ is matched before the UI router. ---
      - "traefik.http.routers.freshrss-api.rule=Host(`freshrss.${FULL_DOMAIN}`) && PathPrefix(`/api/`)"
      - "traefik.http.routers.freshrss-api.entrypoints=https"
      - "traefik.http.routers.freshrss-api.tls=true"
      - "traefik.http.routers.freshrss-api.priority=100"
      - "traefik.http.routers.freshrss-api.service=freshrss"
      - "traefik.http.routers.freshrss-api.middlewares=freshrss-api-ratelimit@docker"
      # Rate-limit per real client IP (Cloudflare passes it in Cf-Connecting-Ip)
      - "traefik.http.middlewares.freshrss-api-ratelimit.ratelimit.average=60"
      - "traefik.http.middlewares.freshrss-api-ratelimit.ratelimit.period=1m"
      - "traefik.http.middlewares.freshrss-api-ratelimit.ratelimit.burst=30"
      - "traefik.http.middlewares.freshrss-api-ratelimit.ratelimit.sourceCriterion.requestHeaderName=Cf-Connecting-Ip"
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=${TIMEZONE}"
      - "CRON_MIN=5,25,45"
    restart: unless-stopped
    env_file:
      - .env

networks:
  proxy:
    external: true

volumes:
  freshrss_data:
    name: freshrss_data
    driver: local