# Exporters here are scraped by mon over Tailscale (vps_tailscale_ip:9100 / :8082),
# so they are deliberately NOT routed through Traefik — no traefik.* labels, no
# proxy network. Adding a router would publish unauthenticated metrics on dinos.sh.
#
# Ports are published on METRICS_BIND_IP (vps-01's tailscale IP) rather than
# 0.0.0.0: Docker's port publishing inserts its own DOCKER chain rules ahead of
# ufw's INPUT chain, so the ufw "allow 9100/8082 on tailscale0 from mon" rules in
# roles/hardening do NOT keep a 0.0.0.0 bind off the public interface. Binding the
# listener itself is what makes these unreachable from the internet.
services:
  node-exporter:
    image: prom/node-exporter:v1.11.1
    container_name: node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.rootfs=/rootfs"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    environment:
      - PUID=1000
      - PGID=1000
    env_file:
      - .env
    ports:
      - "${METRICS_BIND_IP}:9100:9100"
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    restart: unless-stopped
    container_name: cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      - PUID=1000
      - PGID=1000
    env_file:
      - .env
    ports:
      - "${METRICS_BIND_IP}:8082:8080"
