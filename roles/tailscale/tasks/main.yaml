---
- name: Add Tailscale apt signing key
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/{{ ansible_distribution | lower }}/{{ ansible_distribution_release }}.noarmor.gpg"
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    mode: "0644"

- name: Add Tailscale apt repo
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/{{ ansible_distribution | lower }}/{{ ansible_distribution_release }}.tailscale-keyring.list"
    dest: /etc/apt/sources.list.d/tailscale.list
    mode: "0644"

- name: Install Tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: true

- name: Enable and start tailscaled
  ansible.builtin.systemd:
    name: tailscaled
    state: started
    enabled: true

- name: Bring up Tailscale with tag, no subnet acceptance
  ansible.builtin.command:
    cmd: >-
      tailscale up
      --authkey {{ tailscale_authkey }}
      --hostname {{ tailscale_hostname }}
      --advertise-tags {{ tailscale_tags }}
      --accept-routes=false
      --accept-dns=false
      --ssh=false
  register: ts_up
  changed_when: ts_up.rc == 0

# Containers publish ports on the tailscale IP (see configs/monitoring-client-vps).
# At boot docker can restore those containers before tailscaled has configured
# tailscale0, and docker does not retry a failed port allocation — the container
# just stays down until someone restarts it. Allowing non-local binds removes that
# race: the listener binds regardless of whether the address is up yet.
- name: Allow binding to not-yet-configured addresses (tailscale IP at boot)
  ansible.posix.sysctl:
    name: net.ipv4.ip_nonlocal_bind
    value: "1"
    sysctl_file: /etc/sysctl.d/99-tailscale-nonlocal-bind.conf
    sysctl_set: true
    state: present
    reload: true

- name: Get Tailscale IPv4
  ansible.builtin.command: tailscale ip -4
  register: ts_ip
  changed_when: false

- name: Store tailscale IP fact
  ansible.builtin.set_fact:
    tailscale_ip: "{{ ts_ip.stdout | trim }}"
